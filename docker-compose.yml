version: '1.0'

services:
  bot:
    build:
      context: ./imei
      dockerfile: Dockerfile
    volumes:
      ./imei:/app/imei
    env_file:
      - .env
    networks:
      - imei_nt 
    depends_on:
      database:
        condition: service_started

  database:
    image: postgres
    environment:
      POSTGRES_DB: ${NAME_DB}
      POSTGRES_USER: ${USERNAME_DB}
      POSTGRES_PASSWORD: ${PASSWORD_DB}
    ports:
      - ${EXTERNAL_PORT_DB}:${INTERNAL_PORT_DB}
    networks:
      - imei_nt


networks:
  imei_nt:
    name: imei_nt 
