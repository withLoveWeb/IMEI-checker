repos:
  - repo: https://github.com/psf/black
    rev: 23.9.1 
    hooks:
      - id: black
        args: ["--line-length", "110"]

  - repo: https://github.com/PyCQA/autoflake
    rev: v2.3.1
    hooks:
      - id: autoflake
        args: [--remove-all-unused-imports, --in-place]

  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ["--profile", "black"]
